name: Release & Sign

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ── Build & sign WASM binary ────────────────────────────────────────
  sign-wasm:
    name: Build & Sign WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Build WASM
        run: bun wasm:build

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign WASM binary (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob \
            --yes \
            --output-certificate cosign.crt \
            --output-signature cosign.sig \
            crates/wasm/pkg/substrate_wasm_bg.wasm

      - name: Upload WASM + signatures to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            crates/wasm/pkg/substrate_wasm_bg.wasm
            cosign.crt
            cosign.sig

  # ── Build & sign Docker image ──────────────────────────────────────
  sign-image:
    name: Build & Sign Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign \
            --yes \
            ghcr.io/${{ github.repository }}:latest \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

      - name: Verify image signature
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign verify \
            --yes \
            ghcr.io/${{ github.repository }}:latest \
            --certificate-identity https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
