name: Deploy

# ──────────────────────────────────────────────────────────────────────
# Deploy Workflow — 默认关闭，按需开启
# ──────────────────────────────────────────────────────────────────────
# 这是一个基座项目，不包含真实的部署目标。
# Deploy 默认只允许手动触发（workflow_dispatch），不会在 CI 后自动运行。
#
# 当你基于此基座搭建真实产品并准备部署时：
#   1. 在 GitHub repo → Settings → Secrets and variables → Actions 中配置以下密钥：
#        DATABASE_URL            — Postgres 连接串（如 Neon / Supabase）
#        VERCEL_TOKEN            — Vercel Settings → Tokens
#        VERCEL_ORG_ID           — Vercel 项目设置
#        VERCEL_PROJECT_ID       — Vercel 项目设置
#        CLOUDFLARE_API_TOKEN    — Cloudflare → My Profile → API Tokens
#        CLOUDFLARE_ACCOUNT_ID   — Cloudflare 首页右侧
#   2. 如需 CI 通过后自动部署，将下面的 workflow_run 取消注释：
#        on:
#          workflow_run:
#            workflows: ["CI"]
#            types: [completed]
#            branches: [main]
#          workflow_dispatch:
#   3. 在 GitHub Actions 页面手动触发一次 Deploy 验证配置是否正确。
# ──────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:

jobs:
  # Gate: only proceed when CI succeeded. For manual dispatch this always
  # passes; for workflow_run it verifies the triggering CI run concluded
  # with "success". If CI failed or was cancelled, every downstream job
  # (which declares needs: verify-ci) is skipped automatically.
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    steps:
      - name: Confirm CI status
        run: |
          echo "Trigger:        ${{ github.event_name }}"
          echo "CI conclusion:  ${{ github.event.workflow_run.conclusion }}"
          echo "CI head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "CI head SHA:    ${{ github.event.workflow_run.head_sha }}"

  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - name: Run Drizzle migrations
        working-directory: ./packages/db
        run: bun run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-edge:
    name: Deploy Edge to Cloudflare
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun --filter @substrate/edge deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
