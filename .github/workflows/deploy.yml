name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: only proceed when CI succeeded. For manual dispatch this always
  # passes; for workflow_run it verifies the triggering CI run concluded
  # with "success". If CI failed or was cancelled, every downstream job
  # (which declares needs: verify-ci) is skipped automatically.
  verify-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success'
      )
    steps:
      - name: Confirm CI status
        run: |
          echo "Trigger:        ${{ github.event_name }}"
          echo "CI conclusion:  ${{ github.event.workflow_run.conclusion }}"
          echo "CI head branch: ${{ github.event.workflow_run.head_branch }}"
          echo "CI head SHA:    ${{ github.event.workflow_run.head_sha }}"

  migrate:
    name: Database Migration
    runs-on: ubuntu-latest
    needs: verify-ci
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - name: Run Drizzle migrations
        working-directory: ./packages/db
        run: bun run migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-web:
    name: Deploy Aevum to Vercel
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./packages/web

  deploy-edge:
    name: Deploy Edge to Cloudflare
    runs-on: ubuntu-latest
    needs: migrate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - run: bun install --frozen-lockfile
      - run: bun --filter @substrate/edge deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
