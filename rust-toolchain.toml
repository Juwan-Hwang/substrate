[toolchain]
channel = "stable"
components = ["rust-src", "rustfmt", "clippy"]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]
profile = "default"

# WASI Preview 0.3 (wasm32-wasip3) requires nightly — install on demand:
#   rustup toolchain install nightly
#   rustup target add wasm32-wasip3 --toolchain nightly
# Then build with: bun wasm:wasip3
