[package]
name = "substrate-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for Aevum — exposes substrate-core to the browser with GPU acceleration"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
substrate-core.workspace = true

# WASM interop
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
console_error_panic_hook = "0.1"
web-sys = { workspace = true, features = [
    "Window",
    "Navigator",
    "Gpu",
    "GpuAdapter",
    "GpuDevice",
    "GpuBuffer",
    "GpuCanvasContext",
    "GpuShaderModule",
    "GpuComputePipeline",
    "GpuBindGroup",
    "GpuBindGroupLayout",
    "GpuPipelineLayout",
    "GpuCommandEncoder",
    "GpuComputePassEncoder",
    "GpuQueue",
    "Performance",
] }
serde-wasm-bindgen.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# GPU / graphics
wgpu = { workspace = true, features = ["webgpu"] }
bytemuck.workspace = true
glam.workspace = true

# Utilities
pollster.workspace = true
getrandom.workspace = true

[features]
default = []
# Enable std::simd portable vectors (requires nightly).
simd = []

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
