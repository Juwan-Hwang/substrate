# Bun configuration — used for fast scripting, test running, and dev tooling.
# pnpm remains the primary package manager (see packageManager in package.json).
# Bun is used for: `bun test` (unit tests), `bun run` (fast script exec),
# and as a faster alternative to node for turbo tasks.

[test]
coverage = false
preload = ["./setup.ts"]

[install]
# Respect pnpm workspace — don't override lockfile.
lockfile = false
