name = "substrate-edge"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[vars]
SITE_BRAND = "Substrate"

# Upstash Redis (REST API — no TCP socket needed in Workers)
# Set via: wrangler secret put UPSTASH_REDIS_URL / UPSTASH_REDIS_TOKEN
# [vars] cannot hold secrets — use `wrangler secret put` for production.

# Cloudflare Turnstile
# Set via: wrangler secret put TURNSTILE_SECRET

[[r2_buckets]]
binding = "R2"
bucket_name = "substrate-assets"

[[queues.producers]]
queue = "substrate-tasks"
binding = "QUEUE"

[[queues.consumers]]
queue = "substrate-tasks"
max_batch_size = 10
max_batch_timeout = 5

[[durable_objects.bindings]]
name = "DO"
class_name = "ExperimentDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExperimentDO"]

[[hyperdrive.configurations]]
binding = "HYPERDRIVE"
localConnectionString = "postgresql://localhost:5432/substrate"

# Cloudflare Workers AI — edge inference binding
[ai]
binding = "AI"

# Turso / libSQL (edge read replica)
# Set via environment variables:
# TURSO_DATABASE_URL=libsql://substrate.turso.io
# TURSO_AUTH_TOKEN=...

# ── Production environment ────────────────────────────────────────────
# Deploy with: wrangler deploy --env production
# Override name, SITE_BRAND, ALLOWED_ORIGINS, and routes for your site.
[env.production]

[env.production.vars]
SITE_BRAND = "Substrate"
ALLOWED_ORIGINS = "https://example.com"

# Route the edge API through your own domain
# [[env.production.routes]]
# pattern = "api.example.com/*"
# zone_name = "example.com"

# Production secrets — set with `wrangler secret put --env production`:
#   UPSTASH_REDIS_URL
#   UPSTASH_REDIS_TOKEN
#   TURNSTILE_SECRET
